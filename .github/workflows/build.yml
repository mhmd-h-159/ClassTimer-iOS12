name: Build iOS 12 IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Build Unsigned IPA
        run: |
          xcodebuild -project ClassTimer.xcodeproj -scheme ClassTimer -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=build
          mkdir -p Payload
          cp -r build/ClassTimer.app Payload/
          zip -r ClassTimer_iOS12.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClassTimer_iOS12
          path: ClassTimer_iOS12.ipa
